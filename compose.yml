services:
  app:
    build:
      context: .
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/parking_management_development
    tty: true
    stdin_open: true

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password

  js:
    build:
      context: .
    command: npm run build -- --watch
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tty: true

volumes:
  postgres_data:
  bundle:
  node_modules:
