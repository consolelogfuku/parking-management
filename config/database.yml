default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: parking_management_development
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  database: parking_management_test
  url: <%= ENV["DATABASE_URL"] %>

production:
  primary: &primary_production
    <<: *default
    database: parking_management_production
    username: parking_management
    password: <%= ENV["PARKING_MANAGEMENT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: parking_management_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: parking_management_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: parking_management_production_cable
    migrations_paths: db/cable_migrate
